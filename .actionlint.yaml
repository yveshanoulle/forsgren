# actionlint configuration, read by Scripts/check_actionlint.sh
# (`-config-file .actionlint.yaml`, the estate's gate, byte-identical with
# coachretreat-website's), so this file must exist.
#
# NO custom runner label. Every job here runs on a GitHub-hosted image
# (quality.yml on macos-latest since forsgren#1's runner swap, dco.yml on
# ubuntu-latest), and actionlint knows those labels without being told. The
# self-hosted runner's labels, host-babacar and runner-forsgren, were
# declared here until that swap and are gone with it: the empty list below
# keeps every custom label red, so a job sent to a self-hosted runner again
# is a decision made in this file first. Declaring a label is CONFIGURATION,
# not a waiver: actionlint cannot know a label exists unless told.
#
# Scripts/test_check_actionlint.sh pins that runner-forsgren is now red as
# an unknown label, that macos-latest is accepted, and (its mutation proof)
# that a label becomes known only through this file.
self-hosted-runner:
  labels: []

# ONE WAIVER, approved by Yves on forsgren#4:
# https://github.com/yveshanoulle/forsgren/issues/4#issuecomment-5952631931
# metrics.yml installs forsgren from its own commit and repository, which
# GitHub documents on the job context as job.workflow_sha and
# job.workflow_repository. actionlint 1.7.12, the latest release, does not
# know those two properties yet (rhysd/actionlint#705, fix open as #707)
# and reports them as undefined. Ignored for that file and those two names
# only; remove this block once an actionlint release knows them.
paths:
  .github/workflows/metrics.yml:
    ignore:
      - 'property "workflow_(sha|repository)" is not defined in object type'
