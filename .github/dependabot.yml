# Proposes dependency updates as pull requests (forsgren#86): the Go modules in
# go.mod / go.sum, and the commit-pinned `uses:` lines in .github/workflows.
# Scripts/test_dependabot_config.sh keeps this file's shape. Whether the pull
# requests keep the `uses: owner/action@<commit>  # vX.Y.Z` pin format, and
# whether Dependabot also moves the `toolchain` line of go.mod or a
# `go-version:` input, is not documented and is checked on its first runs
# (forsgren#86); the daily vulncheck workflow is the detector for fixes in the
# standard library.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # Every day, weekends included: interval daily runs Monday to Friday
    # only, so a release on a Friday evening waited until Monday.
    schedule:
      interval: cron
      cronjob: "0 4 * * *"   # 04:00 UTC, before the working day
      timezone: UTC
    # A pull request title and commit start with this prefix.
    commit-message:
      prefix: go
    # One pull request for all minor and patch updates of the Go modules,
    # so a run does not open one pull request per module. A major update
    # stays its own pull request, read on its own.
    groups:
      go-modules:
        patterns:
          - "*"
        update-types: [minor, patch]
    # An update is proposed once it is 3 days old (the documented default,
    # written out): a window for a bad release to be replaced or yanked.
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    # Every day, weekends included, as for the Go modules.
    schedule:
      interval: cron
      cronjob: "0 4 * * *"   # 04:00 UTC, before the working day
      timezone: UTC
    # A pull request title and commit start with this prefix.
    commit-message:
      prefix: actions
    # One pull request for all minor and patch updates of the actions, so
    # a run does not open one pull request per action. A major update stays
    # its own pull request.
    groups:
      actions:
        patterns:
          - "*"
        update-types: [minor, patch]
    # An update is proposed once it is 3 days old (the documented default,
    # written out): a window for a bad release to be replaced or yanked.
    cooldown:
      default-days: 3
