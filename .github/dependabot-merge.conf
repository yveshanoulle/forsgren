# The Dependabot merge policy's data (Scripts/dependabot_merge_policy.sh,
# forsgren#664 step 1): which of this repository's own Dependabot updates may
# merge on their own and which workflows must be green first. Widening the
# categories changes this file, not the script. Anything not allowed here
# stays a manual merge.
#
# allow <ecosystem> <dependency-type or *> <update-type>
#   ecosystem: as in Dependabot's branch name dependabot/<ecosystem>/...
#   (github_actions, npm_and_yarn, go_modules, ...)
#   dependency-type and update-type: as in the updated-dependencies block of
#   Dependabot's commit message, the update-type without its version-update:
#   prefix (semver-patch, semver-minor, semver-major)
# workflow <file> <name>
#   a workflow that must have a completed, successful run for the pull
#   request's current head commit; both the file and the name must match, so
#   a renamed or added workflow cannot stand in for it
#
# Allowed: GitHub Actions pins, patch and minor; npm development
# dependencies (the gate tooling of package.json), patch only. Not allowed,
# so always a manual merge: Go modules and the Go toolchain (go_modules: they
# are built into the binary every installation runs), Docker, and every
# major update.
allow github_actions * semver-patch
allow github_actions * semver-minor
allow npm_and_yarn direct:development semver-patch

# Expected: the two workflows that run on every pull request into main.
# Quality runs every gate; DCO checks the sign-off of each commit (a
# Dependabot pull request's commits are exempt as the bot's own, so it is
# green for them). No other workflow of this repository runs on
# pull_request: vulncheck and the token expiry probe are started by hand or
# by a dispatcher, Release by hand, the starter page on push, and Metrics and
# Auto update are reusable workflows for installations.
workflow .github/workflows/quality.yml Quality
workflow .github/workflows/dco.yml DCO
