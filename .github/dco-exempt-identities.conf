# The automation identities whose commits are exempt from the DCO sign-off
# (forsgren#725). A Signed-off-by is a person's certificate (CONTRIBUTING.md,
# Developer Certificate of Origin); an automation identity is no person and
# certifies nothing, so its commits carry no sign-off and are named as exempt.
# This is an exemption, not a certification by the identity.
#
# One identity per line:
#   <numeric account id>|<login>
# Both are GitHub's: `gh api 'users/<login>'` prints the id. A login can be
# renamed or registered again by someone else; the id cannot, and both must
# match. Only a GitHub App's bot account can be listed (a login ending in
# [bot]): a person always signs off. A line in any other shape turns the
# check red for every commit.
#
# Being listed is not enough. Scripts/check_dco.sh exempts a commit only when
# GitHub itself authenticated the listed account as the one that brought it:
# the account that pushed to main, or the account that opened the pull
# request. A commit that only names a listed identity as its author is not
# exempt, and never passes, signed off or not.
#
# The check never reads this file from the change it judges: a pull request
# is judged with the file of its base commit, a push with the file of the
# commit main was at before the push. A change to this list counts from the
# next push or pull request on. Who may change it is who may push to main:
# see "Automation identities" in CONTRIBUTING.md.
#
# Dependabot, GitHub's dependency update service.
49699333|dependabot[bot]
