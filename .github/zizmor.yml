# zizmor configuration — see https://docs.zizmor.sh/configuration/
#
# Ported from web-infra's .github/zizmor.yml (forsgren#1, ladder step 19).
# The gate (Scripts/check_zizmor.sh, one row of Scripts/gate_report_order.txt,
# so sfl and quality.yml alike) runs
#   zizmor --offline --min-severity high .github
# and zizmor reads this file from the directory it scans.
#
# The gate enforces the FULL set of High-severity audits: nothing is
# `disable`d and nothing is ignored. forsgren's workflows had no finding to
# accept when the gate arrived, at any severity under the default persona.
#
# web-infra's single entry, a line-scoped dangerous-triggers ignore for its
# own apply-web-infra.yml, names a file forsgren does not have and is not
# ported. A suppression here, or an inline `# zizmor: ignore[...]` in a
# workflow, needs a finding someone has looked at and Yves's explicit yes
# recorded on a GitHub issue, linked from the entry; scope it to one line of
# one file, as web-infra does, so the audit still fires everywhere else.
# Scripts/test_check_zizmor.sh is red if this file lets template injection
# through.
rules: {}
