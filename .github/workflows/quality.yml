# .github/workflows/quality.yml
#
# forsgren's CI (forsgren#1, ladder step 14; moved to GitHub's macos-latest
# in road to public, step 5, the runner swap). Ported from konenki-website's
# quality.yml: its checkout pin, `npm ci`, report rows and details, and its
# Render report step. NEW here: konenki names every gate in its own step;
# this job runs Scripts/gate_report_order.txt the way sfl.sh does, phase by
# phase, through Scripts/run_ci_phase.sh:
#
#   PRE gates -> Scripts/build_site.sh into .build/site -> POST gates
#
# the same three phases FBP.sh runs locally (gofmt -w, then sfl.sh pre, the
# build, sfl.sh post). Every order-file row runs here and in sfl, under the
# same label; Scripts/test_gate_wiring.sh fails the run when the two drift.
# A red row here is the same row sfl prints, so `./sfl.sh pre` (or post)
# reproduces it locally.
#
# CHECK-ONLY. Nothing here fixes: gofmt runs as `gofmt -l` (the gofmt row),
# never with --fix, and Scripts/run_ci_phase.sh turns any gate that changes
# the checked-out tree into a red row (npm_audit_check.sh's local heal, for
# one), because CI reports what the commit contains.
name: Quality

on:
  # No paths filter, on push or on pull_request: the secret scan, the data
  # guard, stray tracked files and script references read every tracked
  # file, so any filter would leave a change that runs no gate (konenki's
  # rule, pinned by Scripts/test_quality_trigger_scope.sh).
  #
  # pull_request, NEVER pull_request_target (Yves's rulings on forsgren#1,
  # road to public): a contributor's pull request shows the same gate results
  # as a local FBP run. It is safe because the job runs on GitHub's
  # macos-latest, a fresh virtual machine per run that is thrown away after
  # it, and a fork's pull_request run gets a read-only token and no secrets.
  # Scripts/check_workflow_triggers.sh is red on a pull-request trigger in
  # any workflow with a job it cannot prove GitHub-hosted, and
  # Scripts/test_quality_trigger_scope.sh pins this job to macos-latest.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# The job reads the repository and nothing else.
permissions:
  contents: read

# One run per pull request: a new push to it cancels the run in flight, whose
# verdict is about a commit nobody will merge. Never on main: every commit
# there gets its own complete run, neither cancelled nor dropped from the
# queue (GitHub keeps one pending run per group, so a shared group for pushes
# would still drop all but the newest queued one), hence a group per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same environment sfl.sh builds for its gates: Homebrew's
      # prefixes first on PATH (GITHUB_PATH prepends, so /usr/local/bin goes
      # in last to end up first, as in sfl's export), and Go pinned exactly
      # from go.mod's toolchain line. GOTOOLCHAIN needs a Go to start from:
      # the image ships one, and Scripts/install_tools.sh below installs
      # Homebrew's when it does not; either downloads the pinned toolchain
      # on its first run.
      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          # The run summary's duration counts from here (forsgren#8): the
          # first step that runs a shell, so only the checkout before it is
          # not counted. First, so a failure below still leaves it set.
          echo "QS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      # The Homebrew tools of Scripts/required_tools.txt, with the script sfl
      # runs before its gates. The hosted image has none of gitleaks,
      # yamllint, actionlint or zizmor, so without this every gate needing
      # one is red with `command not found`. Installing and upgrading is
      # right here: the machine is thrown away after the job, so nothing
      # outlives the run, and Homebrew's current formulae are what a local
      # sfl run upgrades to as well. A tool still missing afterwards fails
      # this step by name. The two HOMEBREW_ settings only save time on a
      # machine nobody keeps: no cleanup of old versions, and no upgrade of
      # the image's other formulae that happen to depend on what was
      # upgraded.
      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        # npm ci installs exactly package-lock.json, the same versions sfl.sh
        # uses locally, and fails when package.json and the lockfile disagree.
        run: npm ci

      # ROWS/DETAILS are set here rather than in a job-level `env:` block:
      # the `runner` context does not exist when job env is evaluated, so
      # a runner.temp expression there is an Unrecognized named-value and the
      # whole workflow file is rejected before a single step runs. The
      # RUNNER_TEMP environment variable is the runtime equivalent and is
      # available inside a step.
      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          # A DIRECTORY, one file per gate, not one appended log: the report
          # must read in DECLARED order, whatever order the gates ran in.
          rm -rf "$details" && mkdir -p "$details"
          # GITHUB_ENV takes effect in LATER steps, so this step uses the
          # literal paths above and every gate after it uses $ROWS/$DETAILS.
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # Every pre row of Scripts/gate_report_order.txt, in file order. A
      # failing gate does not stop the phase, as in sfl. Exit 2 is a
      # secret-class finding: the build and POST are then skipped, as FBP.sh
      # skips them, and the step fails either way.
      - name: PRE gates
        id: pre
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" && rc=0 || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "secret_block=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # Build boundary. Runs after an ordinary PRE red too (`!cancelled()`),
      # so one run reports every failure, as FBP.sh does; skipped after a
      # secret-class finding. Same default output as FBP.sh, .build/site,
      # which the POST gates read by default.
      - name: Build site
        id: build
        if: ${{ !cancelled() && steps.pre.outputs.secret_block != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/build_site.sh

      # Every post row, on the site just built. Skipped when the build did
      # not succeed: those gates then report as unmeasured, not as passing.
      - name: POST gates
        id: post
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh post "$ROWS" "$DETAILS"

      # Renders whatever ran, as the job's LAST step. `if: always()`
      # matters: the run that most needs a report is the one that failed,
      # or was cancelled.
      #
      # Two blocks, in this order, appended to one summary page: first the
      # run's key numbers (forsgren#8, Scripts/render_quality_summary.sh):
      # status and how far the run got, gates per phase, Go tests, coverage
      # and floors to raise, pages, version, commit, trigger and duration;
      # then the gate table with each gate's output. One step, so the numbers
      # sit above the table without either renderer knowing about the other.
      # Gates that never ran are named rather than omitted: a short table
      # would otherwise read as "fewer checks exist", and a number that does
      # not exist shows as — with its reason, never as 0.
      #
      # Every expression the summary needs comes in through env:, never as
      # ${{ }} inside run:. job.status is the job's status so far: success,
      # failure or cancelled. ROWS and DETAILS are unset when the job stopped
      # before Start report, and the summary then still renders.
      - name: Render summary and report
        if: always()
        shell: bash
        env:
          QS_JOB_STATUS: ${{ job.status }}
          QS_PRE_OUTCOME: ${{ steps.pre.outcome }}
          QS_BUILD_OUTCOME: ${{ steps.build.outcome }}
          QS_POST_OUTCOME: ${{ steps.post.outcome }}
          QS_SECRET_BLOCK: ${{ steps.pre.outputs.secret_block }}
          QS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          rc=0
          ./Scripts/render_quality_summary.sh "${ROWS:-}" "${DETAILS:-}" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          ./Scripts/render_quality_report.sh "${ROWS:-}" "${DETAILS:-}" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          exit "$rc"
