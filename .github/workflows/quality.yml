# .github/workflows/quality.yml
#
# forsgren's CI (forsgren#1, ladder step 14; moved to GitHub's macos-latest
# in road to public, step 5, the runner swap). Ported from another estate repository's
# quality.yml: its checkout pin, `npm ci`, report rows and details, and its
# Render report step. NEW here: konenki names every gate in its own step;
# this job runs Scripts/gate_report_order.txt the way sfl.sh does, phase by
# phase, through Scripts/run_ci_phase.sh:
#
#   PRE gates -> Scripts/build_site.sh into .build/site -> POST gates
#
# the same three phases FBP.sh runs locally (gofmt -w, then sfl.sh pre, the
# build, sfl.sh post). Every order-file row runs here and in sfl, under the
# same label; Scripts/test_gate_wiring.sh fails the run when the two drift.
# A red row here is the same row sfl prints, so `./sfl.sh pre` (or post)
# reproduces it locally.
#
# JOBS (forsgren#259, decision #260). One workflow, parallel jobs, ONE Quality
# verdict: the run's conclusion is success only when every job succeeded, which
# is what Scripts/release_quality.sh reads (the run, never a job). The main job
# `quality` runs every gate that Scripts/ci_job_groups.txt does not give to
# another job; the `lint` job runs actionlint, shellcheck, yamllint and zizmor
# with their self-tests (forsgren#282), the jobs `isolation_1` and `isolation_2`
# the git sandbox isolation self-test in two shards, one each (forsgren#426),
# the `summary` job the step summary isolation gate
# (forsgren#425), the `quality_2` job twelve gates of the main job and the Go
# coverage gate (forsgren#447) and the `browser` job
# the browser gates (with their own site build), and the `workflows` job the
# pins of the workflows and the wiring of the gates (forsgren#408), all with
# the same setup; the
# `report` job merges
# what each job handed over (an artifact quality-report-<job>) into the one
# Quality report; `preview` needs them all. Scripts/test_quality_jobs.sh pins
# the layout.
#
# CHECK-ONLY. Nothing here fixes: gofmt runs as `gofmt -l` (the gofmt row),
# never with --fix, and Scripts/run_ci_phase.sh turns any gate that changes
# the checked-out tree into a red row (npm_audit_check.sh's local heal, for
# one), because CI reports what the commit contains.
name: Quality

on:
  # No paths filter, on push or on pull_request: the secret scan, the data
  # guard, stray tracked files and script references read every tracked
  # file, so any filter would leave a change that runs no gate (konenki's
  # rule, pinned by Scripts/test_quality_runner_pins.sh).
  #
  # pull_request, NEVER pull_request_target (Yves's rulings on forsgren#1,
  # road to public): a contributor's pull request shows the same gate results
  # as a local FBP run. It is safe because the job runs on GitHub's
  # macos-latest, a fresh virtual machine per run that is thrown away after
  # it, and a fork's pull_request run gets a read-only token and no secrets.
  # Scripts/check_workflow_triggers.sh is red on a pull-request trigger in
  # any workflow with a job it cannot prove GitHub-hosted, and
  # Scripts/test_quality_runner_pins.sh pins this job to macos-latest.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # By hand the run is the full Quality, as on a push.
  workflow_dispatch:

# The job reads the repository and nothing else.
permissions:
  contents: read

# One run per pull request: a new push to it cancels the run in flight, whose
# verdict is about a commit nobody will merge. Never on main: every commit
# there gets its own complete run, neither cancelled nor dropped from the
# queue (GitHub keeps one pending run per group, so a shared group for pushes
# would still drop all but the newest queued one), hence a group per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: macos-latest
    # What the report job needs of this job's steps (forsgren#259): the
    # outcome of each phase's step, the secret-class stop and the start time.
    outputs:
      pre: ${{ steps.pre.outcome }}
      build: ${{ steps.build.outcome }}
      post: ${{ steps.post.outcome }}
      secret_block: ${{ steps.pre.outputs.secret_block }}
      started_at: ${{ steps.setup.outputs.started_at }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The same environment sfl.sh builds for its gates: Homebrew's
      # prefixes first on PATH (GITHUB_PATH prepends, so /usr/local/bin goes
      # in last to end up first, as in sfl's export), and Go pinned exactly
      # from go.mod's toolchain line. GOTOOLCHAIN needs a Go to start from:
      # the image ships one, and Scripts/install_tools.sh below installs
      # Homebrew's when it does not; either downloads the pinned toolchain
      # on its first run.
      - name: Set up the gate environment
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          # The run summary's duration counts from here (forsgren#8): the
          # first step that runs a shell, so only the checkout before it is
          # not counted. First, so a failure below still leaves it set. It
          # leaves this job as the output started_at, for the report job.
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      # Exactly the Node major of .nvmrc, the file Scripts/check_node_pin.sh
      # enforces in sfl and in the Node pin row below (forsgren#2, decision
      # #190): one source for the pin, here and locally. Without this step the
      # job runs whatever Node Homebrew has that day, and the Node pin row goes
      # red the day Homebrew moves to another major. After the step above, so
      # its PATH entry (GITHUB_PATH prepends) ends up ahead of Homebrew's, and
      # before the tool install and npm ci. No package-manager cache: the
      # lockfile alone decides what npm ci installs, and a restored cache is
      # one more input.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The Homebrew tools of Scripts/required_tools.txt, with the script sfl
      # runs before its gates. The hosted image has none of gitleaks,
      # yamllint, actionlint or zizmor, so without this every gate needing
      # one is red with `command not found`. Installing and upgrading is
      # right here: the machine is thrown away after the job, so nothing
      # outlives the run, and Homebrew's current formulae are what a local
      # sfl run upgrades to as well. A tool still missing afterwards fails
      # this step by name. The two HOMEBREW_ settings only save time on a
      # machine nobody keeps: no cleanup of old versions, and no upgrade of
      # the image's other formulae that happen to depend on what was
      # upgraded.
      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        # npm ci installs exactly package-lock.json, the same versions sfl.sh
        # uses locally, and fails when package.json and the lockfile disagree.
        run: npm ci

      # ROWS/DETAILS are set here rather than in a job-level `env:` block:
      # the `runner` context does not exist when job env is evaluated, so
      # a runner.temp expression there is an Unrecognized named-value and the
      # whole workflow file is rejected before a single step runs. The
      # RUNNER_TEMP environment variable is the runtime equivalent and is
      # available inside a step.
      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          # A DIRECTORY, one file per gate, not one appended log: the report
          # must read in DECLARED order, whatever order the gates ran in.
          rm -rf "$details" && mkdir -p "$details"
          # GITHUB_ENV takes effect in LATER steps, so this step uses the
          # literal paths above and every gate after it uses $ROWS/$DETAILS.
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # Every pre row of Scripts/gate_report_order.txt, in file order. A
      # failing gate does not stop the phase, as in sfl. Exit 2 is a
      # secret-class finding: the build and POST are then skipped, as FBP.sh
      # skips them, and the step fails either way.
      - name: PRE gates
        id: pre
        shell: bash
        # The private-names gate reads its list from this secret; no list
        # is exit 2 there, never a silent pass (forsgren#52).
        env:
          FORSGREN_PRIVATE_NAMES: ${{ secrets.FORSGREN_PRIVATE_NAMES }}
          # Names only this repository must keep out, added to the shared list.
          # Optional: an unset secret is an empty variable, and the gate then
          # uses the shared list alone.
          FORSGREN_PRIVATE_NAMES_EXTRA: ${{ secrets.FORSGREN_PRIVATE_NAMES_EXTRA }}
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" main && rc=0 || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "secret_block=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # Build boundary. Runs after an ordinary PRE red too (`!cancelled()`),
      # so one run reports every failure, as FBP.sh does; skipped after a
      # secret-class finding. Same default output as FBP.sh, .build/site,
      # which the POST gates read by default.
      - name: Build site
        id: build
        if: ${{ !cancelled() && steps.pre.outputs.secret_block != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/build_site.sh

      # Every post row, on the site just built. Skipped when the build did
      # not succeed: those gates then report as unmeasured, not as passing.
      - name: POST gates
        id: post
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh post "$ROWS" "$DETAILS" main

      # Hands over whatever ran (forsgren#259): the rows, the details and the
      # page count, as the artifact quality-report-quality, for the report job,
      # which merges every job's hand-over into the one Quality report and
      # renders it. `if: always()` matters: the run that most needs a report is
      # the one that failed, or was cancelled. ROWS and DETAILS are unset when
      # the job stopped before Start report, and the hand-over is then empty,
      # which the report names.
      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover" .build/site-page-count.log

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-quality
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

      # What this site has agreed to live with, as markdown tables on the run
      # page, one step per gate so each is easy to find in the job's step list.
      # `if: always()`: they show even when a gate is red. They read the baseline
      # data files only and run no gate; a file the site does not have is said
      # so (there is no image size gate here), and an unreadable one fails the
      # step.
      - name: Language baselines
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/report_baselines.sh language

      - name: Browser baselines
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/report_baselines.sh browser

      - name: Image baselines
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/report_baselines.sh image

  # The quality_2 job (forsgren#447): thirteen rows that Scripts/ci_job_groups.txt
  # gives to this job and Scripts/run_ci_phase.sh skips in the main job (the
  # twelve slowest gates after the ones with a job of their own, about 306 s,
  # and the Go coverage gate, which reads the profile the Go tests gate writes,
  # so the two run together). The same setup as the main job, step for step:
  # its comments are the main job's. No site build: all are PRE rows and none
  # reads .build/site. No secret reaches it: none of its gates reads one or is
  # secret-class. macos-latest: the exit-trap completion behaviour gate tests
  # the bash 3.2 of macOS (/bin/bash).
  quality_2:
    name: Quality gates 2/2
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Quality gates 2/2
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" quality_2

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-quality_2
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The lint job (forsgren#282): actionlint, shellcheck, yamllint and zizmor
  # with their self-tests, the static lint rows of the order file's static
  # block (Scripts/ci_job_groups.txt gives them to this job, and
  # Scripts/run_ci_phase.sh skips them in the main job), so a lint finding is
  # its own red check on the run. The same setup as the main job, step for
  # step: its comments are the main job's. No site build: all are PRE rows.
  # No secret reaches it: none of its gates reads one or is secret-class.
  # It runs on ubuntu-latest (forsgren#427): the four tools behave the same on
  # Linux and read files only. Its tools come from pinned, checksum-verified
  # builds (Scripts/install_tools_linux.sh), not Homebrew.
  lint:
    name: Lint gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The four lint tools from their pinned release builds, checksum
      # verified (Scripts/linux_tool_pins.txt), not Homebrew, by
      # Scripts/install_tools_linux.sh.
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/install_tools_linux.sh Scripts/required_tools_linux.txt

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Lint gates
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" lint

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-lint
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The isolation jobs (forsgren#259, decision #260; two shards since
  # forsgren#426): the git sandbox isolation self-test, the slowest gate no
  # other gate waits for. It runs its 34 git-using self-tests in two shards,
  # one job each: Scripts/ci_job_groups.txt gives the gate to isolation_1 with
  # --shard 1/2 and to isolation_2 with --shard 2/2, and Scripts/run_ci_phase.sh
  # skips it in the main job and passes each job its argument (the self-test
  # runs every second self-test of its sorted list, so each runs in exactly one
  # shard and a new one lands in one by itself). Each shard hands over a row
  # named for it, `... (shard 1/2)`, and Scripts/merge_quality_report.sh joins
  # the two into the gate's one row. The step summary isolation gate has the
  # summary job (forsgren#425). The same setup as the main job, step for step,
  # so the gates see the same environment: its comments are the main job's. No
  # site build: it is a PRE row. No secret reaches it: the gate reads none, and
  # the secret-class stop of PRE stays in the main job, whose exit 2 skips the
  # build there. isolation_2 is isolation_1 with the other shard: Scripts/test_quality_jobs.sh
  # pins both.
  isolation_1:
    name: Isolation gates 1/2
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Isolation gates 1/2
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" isolation_1

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-isolation_1
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  isolation_2:
    name: Isolation gates 2/2
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Isolation gates 2/2
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" isolation_2

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-isolation_2
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The summary job (forsgren#425): the step summary isolation gate, split from
  # the isolation job so the two gates run in parallel (Scripts/ci_job_groups.txt
  # gives it to this job, and Scripts/run_ci_phase.sh skips it in the main job). The same setup as the
  # main job, step for step, so the gates see the same environment: its
  # comments are the main job's. No site build: it is a PRE row. No secret
  # reaches it: the gate reads none, and the secret-class stop of PRE stays
  # in the main job, whose exit 2 skips the build there.
  summary:
    name: Summary isolation gates
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Summary isolation gates
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" summary

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-summary
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The browser job (forsgren#259, decision #260): the browser gate self-test,
  # its process self-test (forsgren#386), the browser gate, and the browser gate on the fixture site with its
  # self-test (Scripts/ci_job_groups.txt gives them to this job, and
  # Scripts/run_ci_phase.sh skips them in the main job), about 295 s of gates.
  # The same setup as the main job, step for step: the hosted image's Chrome is
  # the one the gates open, puppeteer-core and axe-core come from npm ci. The
  # browser gate reads the built site, so this job builds its own (.build/site,
  # 0.3 s) between its PRE and POST rows, exactly as the main job does; the
  # fixture-site gate renders its own. No secret reaches it, and none of its
  # gates is secret-class.
  browser:
    name: Browser gates
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The pre rows Scripts/ci_job_groups.txt gives to this job: the two
      # browser self-tests.
      - name: Browser PRE gates
        id: pre
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" browser

      # This job's own site build, after an ordinary PRE red too.
      - name: Build site
        id: build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/build_site.sh

      # The post rows of this job: the browser gate and the fixture-site gate.
      # Skipped when the build did not succeed: they then report as
      # unmeasured, not as passing.
      - name: Browser POST gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh post "$ROWS" "$DETAILS" browser

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-browser
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The workflows job (forsgren#408): the gates that read only the workflows
  # and the wiring of the gates (Scripts/ci_job_groups.txt gives them to this
  # job, and Scripts/run_ci_phase.sh skips them in the main job), about 260 s
  # that kept the main job at 15 minutes. The same setup as the main job, step
  # for step: its comments are the main job's. No site build: all are PRE
  # rows. No secret reaches it: none of its gates reads one or is secret-class.
  workflows:
    name: Workflow gates
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the gate environment
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -euo pipefail
          ./Scripts/install_tools.sh

      - name: Install dependencies
        run: npm ci

      - name: Start report
        shell: bash
        run: |
          set -euo pipefail
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          : > "$rows"
          rm -rf "$details" && mkdir -p "$details"
          echo "ROWS=${rows}" >> "$GITHUB_ENV"
          echo "DETAILS=${details}" >> "$GITHUB_ENV"

      # The rows Scripts/ci_job_groups.txt gives to this job, in order-file
      # order. A failing gate does not stop the phase, as in the main job.
      - name: Workflow gates
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/run_ci_phase.sh pre "$ROWS" "$DETAILS" workflows

      - name: Collect the gate report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ./Scripts/merge_quality_report.sh handover "${ROWS:-}" "${DETAILS:-}" "${RUNNER_TEMP}/handover"

      - name: Hand over the gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-report-workflows
          path: ${{ runner.temp }}/handover
          retention-days: 1
          if-no-files-found: error

  # The one Quality report (forsgren#259): merges what every gate job handed
  # over and renders it, on this job's run page. needs: every gate job (a gate
  # job added later must be added), `if: always()`: the run that most needs a
  # report is the one where a job failed, or was cancelled. It judges nothing
  # itself: a red gate job makes the run red on its own, and the run's
  # conclusion, which the Release reads, comes from all the jobs.
  #
  # Nothing before the Render step writes the run page (forsgren#233):
  # Scripts/test_quality_summary_first.sh pins it. Blocks, in this order,
  # appended to one summary page: first the run's key numbers
  # (forsgren#8, Scripts/render_quality_summary.sh): status and how far the run
  # got, gates per phase, Go tests, the total checks, coverage and floors to
  # raise, pages, version, commit, trigger and duration; then the gate table
  # with each gate's output. Gates that never ran are named rather than
  # omitted: a job that handed over nothing leaves its gates unmeasured, never
  # passing, and a number that does not exist shows as - with its reason.
  #
  # Every expression the summary needs comes in through env:, never as
  # expression syntax inside run:. QS_JOB_STATUS is the merge script's status
  # of the jobs' results (needs.<job>.result), the way job.status was for one
  # job.
  report:
    name: Quality report
    needs: [quality, quality_2, lint, isolation_1, isolation_2, summary, browser, workflows]
    if: always()
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the gate reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: quality-report-*
          path: ${{ runner.temp }}/handover

      - name: Render summary and report
        if: always()
        shell: bash
        env:
          QS_QUALITY_RESULT: ${{ needs.quality.result }}
          QS_QUALITY_2_RESULT: ${{ needs.quality_2.result }}
          QS_LINT_RESULT: ${{ needs.lint.result }}
          QS_ISOLATION_1_RESULT: ${{ needs.isolation_1.result }}
          QS_ISOLATION_2_RESULT: ${{ needs.isolation_2.result }}
          QS_SUMMARY_RESULT: ${{ needs.summary.result }}
          QS_BROWSER_RESULT: ${{ needs.browser.result }}
          QS_WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          QS_PRE_OUTCOME: ${{ needs.quality.outputs.pre }}
          QS_BUILD_OUTCOME: ${{ needs.quality.outputs.build }}
          QS_POST_OUTCOME: ${{ needs.quality.outputs.post }}
          QS_SECRET_BLOCK: ${{ needs.quality.outputs.secret_block }}
          QS_STARTED_AT: ${{ needs.quality.outputs.started_at }}
          QS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          rc=0
          art="${RUNNER_TEMP}/handover"
          rows="${RUNNER_TEMP}/quality_rows.md"
          details="${RUNNER_TEMP}/quality_details"
          mkdir -p "$art"
          ./Scripts/merge_quality_report.sh merge "$art" "$rows" "$details" || rc=$?
          QS_JOB_STATUS="$(./Scripts/merge_quality_report.sh status \
            "$QS_QUALITY_RESULT" "$QS_QUALITY_2_RESULT" "$QS_LINT_RESULT" "$QS_ISOLATION_1_RESULT" "$QS_ISOLATION_2_RESULT" \
            "$QS_SUMMARY_RESULT" "$QS_BROWSER_RESULT" "$QS_WORKFLOWS_RESULT")"
          export QS_JOB_STATUS
          export SITE_PAGE_COUNT_FILE="${art}/quality-report-quality/page-count.log"
          ./Scripts/render_quality_summary.sh "$rows" "$details" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          ./Scripts/render_quality_report.sh "$rows" "$details" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          exit "$rc"

  # Starts the preview deploy (forsgren#222), only after every gate job
  # succeeded for this very commit, so a pushed commit that fails Quality
  # never reaches the preview site (Yves's ruling). The preview shows what the
  # next release will look like on real data: the public metrics installation's
  # collected data rendered with the newest code on main, at
  # https://feta.forsgren.forsgren.be. It lives in yveshanoulle/forsgren-metrics-feta,
  # whose preview.yml takes the pushed sha as its one input and never collects.
  # This job only starts it: Scripts/dispatch_preview.sh POSTs a
  # workflow_dispatch and requires HTTP 204; any other answer fails the run.
  #
  # needs: every other job (quality, quality_2, lint, isolation_1, isolation_2, summary, browser, workflows and report), no `if: always()`: a failed,
  # cancelled or skipped gate job skips this one. The condition keeps it off
  # pull requests, where no secret exists. The secret PREVIEW_DISPATCH_TOKEN
  # (Actions read/write on the preview repository only) reaches this job's one
  # step as env:, nowhere else. Never workflow_run (a dangerous trigger).
  # The job group never cancels a run in flight; GitHub keeps the newest of
  # the waiting ones, and the preview workflow cancels an older deploy itself.
  # macos-latest like every job here (Scripts/test_quality_runner_pins.sh).
  # Scripts/test_preview_workflow.sh pins this job.
  preview:
    name: Start the preview deploy
    needs: [quality, quality_2, lint, isolation_1, isolation_2, summary, browser, workflows, report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: read   # the checkout of Scripts/dispatch_preview.sh
    concurrency:
      group: preview-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Start the preview deploy
        shell: bash
        env:
          PREVIEW_DISPATCH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: ./Scripts/dispatch_preview.sh "$SHA"
