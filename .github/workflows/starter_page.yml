# .github/workflows/starter_page.yml
#
# The starter page (forsgren#132): README.md rendered to one HTML page and
# published to GitHub Pages, the page forsgren.be shows. Scripts/
# test_starter_page_workflow.sh pins this file in sfl and Quality on every
# run: its triggers, permissions, pins and the build command.
#
# Triggers (decision forsgren#149): a push to main that touches the README,
# the renderer, the stylesheet it ships or this workflow; a published release
# (so the page is rebuilt from the README of the release's day); and by hand.
# NEVER pull_request: nothing here needs to run for a pull request, and the
# deploy job holds the Pages token. Both jobs run on GitHub's hosted
# ubuntu-latest, thrown away after the job.
#
# The token: the workflow asks for contents: read, and only the deploy job
# adds pages: write and id-token: write, which GitHub Pages' deploy action
# needs to publish and to prove who published. The build job never holds
# them: it builds and uploads the artifact, and nothing in it can publish.
# Every action is pinned by commit, the same commits metrics.yml and
# quality.yml use.
#
# The live check (forsgren#205, ruling item 3): a third job, after the deploy
# and only when the deploy step really published, runs Scripts/live_check.sh
# against https://forsgren.be: the http redirect, the validated certificate, a
# 200 page and its stylesheet as text/css. It holds contents: read only and
# cannot undo the deploy; a failed check makes the job red. A release run that
# skipped the deploy (Pages not enabled) skips it too.
#
# GitHub Pages must be enabled on the repository with the source "GitHub
# Actions" (Settings, Pages) for the deploy to succeed; a release-triggered
# run skips the deploy with a notice while it is not.
name: Starter page

on:
  push:
    branches: [main]
    paths:
      - README.md
      - cmd/readmepage/**
      - internal/readmepage/**
      - internal/page/styles.css
      - Scripts/build_starter_page.sh
      - .github/workflows/starter_page.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a deployment in flight is never cancelled:
# GitHub's own advice for Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render the starter page
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Exactly the Go of go.mod's toolchain line, the Go sfl, FBP.sh and
      # Quality build with (Scripts/test_starter_page_workflow.sh keeps the two
      # equal). No cache: one more input to the published page.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build the starter page
        run: ./Scripts/build_starter_page.sh

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .build/starter

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}

    steps:
      # A release-triggered run skips the deploy, with a notice saying why,
      # while GitHub Pages is not enabled for the repository: it neither
      # fails nor tries to configure Pages (decision forsgren#149). Only a
      # 404 means "not enabled"; any other answer fails the step, so a token
      # or API problem is never read as a skip. The token is the job's own,
      # which holds pages: write already; no permission is added for this.
      # A push or a manual run is not checked: with Pages off, deploy-pages
      # fails by name, which is what those runs should do.
      - name: Check that GitHub Pages is enabled
        id: pages
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          status=0
          error="$(gh api "repos/${REPOSITORY}/pages" 2>&1 >/dev/null)" || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$error" == *"HTTP 404"* ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Pages is not enabled for ${REPOSITORY}, so this release run skips the deploy. Enable it (Settings, Pages, Source: GitHub Actions)."
          else
            echo "::error title=GitHub Pages check failed::gh api repos/${REPOSITORY}/pages exited ${status}; the deploy is not skipped on a guess."
            exit 1
          fi

      - name: Publish to GitHub Pages
        id: deployment
        if: github.event_name != 'release' || steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  live-check:
    name: Check the live site
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the live site
        run: ./Scripts/live_check.sh https://forsgren.be
