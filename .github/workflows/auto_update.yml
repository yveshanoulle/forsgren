# .github/workflows/auto_update.yml
#
# The REUSABLE workflow an installation's caller, forsgren-update.yml, runs
# on a Dependabot pull request that bumps forsgren's pin (forsgren#58): it
# asks forsgren check-update whether the pull request may be merged, merges
# it, and starts the installation's forsgren.yml.
#
# It runs only when called (workflow_call): never in forsgren's own
# repository, never on a pull request of its own. It has no permissions
# block, on purpose, as metrics.yml explains: the caller's job grants them
# (contents: write, pull-requests: write, actions: write), and a called
# workflow can only keep or narrow what its caller grants.
#
# Scripts/test_auto_update_workflow.sh pins this file's shape, grown one
# cycle at a time.
name: Auto update

on:
  workflow_call:

jobs:
  update:
    name: Merge a safe forsgren update
    runs-on: ubuntu-latest
    steps:
      # Exactly the Go of go.mod's toolchain line, and exactly metrics.yml's
      # step (Scripts/test_auto_update_workflow.sh keeps the two identical).
      # setup-go exports GOTOOLCHAIN=local, so go install builds with this Go
      # and never switches to another. No cache: the caller's repository has
      # no go.sum to key it on.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      # The CALLER's repository, to read its forsgren.config.yml, at the pull
      # request's BASE commit and not at the default checkout of a
      # pull_request event (the merge commit, which carries the pull request's
      # own changes). The config decides whether an update may be merged
      # (auto_update: true), so it must be the one the maintainer committed: a
      # pull request can never switch auto_update on for itself. Pinned by
      # full commit like every action here (the very one metrics.yml and
      # Quality use), and persist-credentials: false so the token is not left
      # in the checkout's git config. An expression in with: is no template
      # injection; only one in a run: block is.
      - name: Check out the caller's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b2  # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      # forsgren from this workflow's OWN commit and repository, and from
      # nothing else, as metrics.yml does (ruling on forsgren#4: the caller's
      # one `uses: ...@<commit> # vX.Y.Z` line is the only version). The job
      # context gives a called workflow both, job.workflow_sha and
      # job.workflow_repository; the github context would be the CALLER's.
      # Both are checked before go runs: 40 lower-case hex digits, and one
      # owner/name. Inline, not a Scripts/ file: forsgren's scripts are not on
      # the runner of the caller's repository. Both arrive through env:, never
      # as a GitHub expression in the script.
      - name: Install forsgren from this workflow's own commit
        shell: bash
        env:
          FORSGREN_SHA: ${{ job.workflow_sha }}
          FORSGREN_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          full_commit='^[0-9a-f]{40}$'
          owner_name='^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_][A-Za-z0-9_.-]*$'
          if [[ ! "$FORSGREN_SHA" =~ $full_commit ]]; then
            echo "::error title=forsgren commit::job.workflow_sha is not a full 40-digit commit; forsgren is installed only from the exact commit this workflow is called at"
            exit 1
          fi
          if [[ ! "$FORSGREN_REPOSITORY" =~ $owner_name ]]; then
            echo "::error title=forsgren repository::job.workflow_repository is not one owner/name; forsgren is installed only from the repository this workflow lives in"
            exit 1
          fi
          echo "forsgren ${FORSGREN_REPOSITORY}@${FORSGREN_SHA}"
          export GOBIN="${RUNNER_TEMP}/forsgren-bin"
          go install "github.com/${FORSGREN_REPOSITORY}/cmd/forsgren@${FORSGREN_SHA}"
          echo "${GOBIN}" >> "$GITHUB_PATH"

      # Asks forsgren whether this pull request may be merged, from the
      # checked-out config. The job's token and the pull request's number
      # reach the script through env:, never as a GitHub expression in it;
      # GITHUB_REPOSITORY is the caller's. Exit 1 is not a failure: the pull
      # request is left for a human, so the reason goes to the job summary,
      # the output merge=false tells the steps after this one not to run, and
      # the step succeeds. GitHub runs shell: bash with -e whatever the script
      # sets, so the status is captured with || and never left to kill the
      # step. Any other status fails the job as it is, after an ::error that
      # names check-update and the status. Exit 0 is the go: merge=true. What
      # check-update printed is shown between ::stop-commands::<token> and
      # ::<token>::, the token random per run, so text from a pull request or
      # a configuration can never run as a workflow command and cannot close
      # the pair it sits in, as metrics.yml does for check-config.
      - name: Ask whether the pull request may be merged
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          status=0
          out="$(forsgren check-update --config forsgren.config.yml --repo "$GITHUB_REPOSITORY" --pull "$PR_NUMBER")" || status=$?
          if [[ "$status" -eq 2 ]]; then
            echo "::error title=forsgren check-update::check-update failed with exit 2"
            exit 2
          fi
          token="$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          printf '%s\n' "$out"
          echo "::${token}::"
          if [[ "$status" -eq 0 ]]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -eq 1 ]]; then
            printf '%s\n' "$out" >> "$GITHUB_STEP_SUMMARY"
            gh --version
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=forsgren check-update::check-update failed with exit ${status}; see the log above"
          fi
          exit "$status"

      # Merges the pull request when the guard said so, and then starts the
      # installation's forsgren.yml on its default branch by hand: a merge
      # made with the job's token (GITHUB_TOKEN) triggers no other workflow,
      # so without this the merged update would wait for the next daily run.
      # A failed merge fails the step (set -e) before anything is started.
      - name: Merge the pull request and start forsgren.yml
        id: merge
        if: steps.guard.outputs.merge == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # ${{ github.event.pull_request.number }}
          gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
          gh workflow run forsgren.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"
