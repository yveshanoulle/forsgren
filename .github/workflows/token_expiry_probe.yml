# .github/workflows/token_expiry_probe.yml
#
# The weekly token expiry probe (forsgren#269): Scripts/probe_token_expiry.sh
# makes one cheap API call with each of forsgren's two fine-grained tokens
# held as Actions secrets (FORSGREN_RELEASE_TOKEN, PREVIEW_DISPATCH_TOKEN),
# reads GitHub's github-authentication-token-expiration
# header and writes token-probed.tsv: one line per secret,
# <SECRET_NAME><TAB><YYYY-MM-DD | never | error: <reason>>. The file is the
# artifact token-expiry-probe, uploaded even when the probe fails; a token
# that is missing, refused or unreadable then turns the run red with a ❌ line
# naming the secret. A token is never printed or passed as an argument.
#
# Triggers: schedule and workflow_dispatch, nothing else. One cron entry,
# Mondays at 06:17 UTC, an off-peak minute. Runs on GitHub's hosted
# ubuntu-latest. Scripts/test_probe_token_expiry.sh pins this file.
name: Token expiry probe

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe token expiry
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Probe the tokens
        shell: bash
        env:
          FORSGREN_RELEASE_TOKEN: ${{ secrets.FORSGREN_RELEASE_TOKEN }}
          PREVIEW_DISPATCH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: ./Scripts/probe_token_expiry.sh token-probed.tsv

      - name: Upload the probe result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: token-expiry-probe
          path: token-probed.tsv
          if-no-files-found: error
