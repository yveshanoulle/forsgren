# .github/workflows/metrics.yml
#
# The REUSABLE workflow an installation's data repository calls once a day
# (forsgren#4, walking skeleton step 2 of #3). It installs forsgren from the
# very commit it is called at, renders the page and publishes it to the
# caller's GitHub Pages. A new install has no forsgren.config.yml: the run
# writes the starter with forsgren init-config and commits that one file to
# the branch the run is on (forsgren#12). Before it renders, it checks
# the caller's forsgren.config.yml with forsgren check-config, so an invalid
# configuration fails the job by name instead of publishing from it. Today
# the page is the skeleton's placeholder, "Forsgren <version>", with a line
# saying so while no projects are configured; collect and the history file
# come later.
#
# It runs only when called (workflow_call): never in forsgren's own
# repository, never on a pull request. Its job runs in the CALLER's
# repository, with the caller's token, on a GitHub-hosted runner. It checks
# out the CALLER's repository (to read its forsgren.config.yml) and never
# forsgren's: forsgren arrives as a Go module through go install, verified
# against the Go checksum database, never as this repository's working tree.
#
# THE CALLER (see README, Running forsgren) pins this file with ONE line, by
# commit, the release named in its comment:
#   uses: yveshanoulle/forsgren/.github/workflows/metrics.yml@<commit> # vX.Y.Z
# That line is the only version (ruling on forsgren#4, 2026-10-02): the
# workflow takes no input naming one, and installs forsgren from the commit
# and repository the line names, which GitHub hands a called workflow as
# job.workflow_sha and job.workflow_repository. The caller grants the job's
# permissions below (a called workflow can only keep or narrow the
# permissions its caller's job grants, never widen them), and has GitHub
# Pages set to build from GitHub Actions.
#
# Scripts/test_metrics_workflow.sh pins this file's shape in sfl and Quality:
# workflow_call only and no inputs, the install step's commit and repository
# from the job context through env: only, its checks executed there against
# good and bad commits and repositories, setup-go on go.mod's toolchain
# before it, the caller's checkout pinned by commit without persisted
# credentials, the starter step, executed there with a real git against a
# local remote (one commit of one file, as github-actions[bot], pushed with
# the token in the environment and never in an argument, a file or the log)
# and with the real forsgren, and the config check, executed there with a
# stub and with the real forsgren, between install and render, its message
# never run as a workflow command.
name: Metrics

on:
  workflow_call:

# Nothing at the workflow level; the one job asks for what it uses.
permissions: {}

jobs:
  publish:
    name: Render and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # checkout reads with it; the starter step pushes ONE commit, a new install's forsgren.config.yml, to the run's branch
      pages: write      # deploy-pages publishes the site to the caller's GitHub Pages
      id-token: write   # deploy-pages proves to Pages, with an OIDC token, which run deploys
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One Pages deployment at a time per repository; a second run waits
    # rather than cancelling one in flight, as GitHub's Pages starter does.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # Exactly the Go of go.mod's toolchain line, the Go sfl, FBP.sh and
      # Quality build with (Scripts/test_metrics_workflow.sh keeps the two
      # equal). setup-go exports GOTOOLCHAIN=local, so go install builds with
      # this Go and never switches to another: a forsgren release whose go
      # line needs a newer Go fails here by name rather than building with
      # one nobody chose. No cache: the caller's repository has no go.sum to
      # key it on, and a restored cache is one more input to the published
      # page.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      # forsgren from this workflow's OWN commit and repository, and from
      # nothing else. The job context gives a called workflow both:
      # job.workflow_sha, "the commit SHA of the workflow file that defines
      # the current job", and job.workflow_repository, its owner/repo. The
      # github context will not do: in a called workflow it "is always
      # associated with the caller workflow", so github.workflow_sha is the
      # caller's commit. Commit and repository come from the same context,
      # so a fork calling its own copy installs the fork (and, while its
      # go.mod still declares upstream's module path, go install refuses it
      # by name), never upstream in silence.
      #
      # Both are checked before go runs: the commit must be 40 lower-case hex
      # digits, so a tag or branch (which would install whatever it names on
      # the day of the run) never reaches the module proxy; the repository
      # must be one owner/name. Inline, not a Scripts/ file: the job checks
      # out the caller's repository, not forsgren's, so forsgren's scripts
      # are not on the runner, and the only commit it could check one out at
      # is the one still unchecked.
      # Both arrive through env:, never as ${{ }} in the script.
      - name: Install forsgren from this workflow's own commit
        shell: bash
        env:
          FORSGREN_SHA: ${{ job.workflow_sha }}
          FORSGREN_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          full_commit='^[0-9a-f]{40}$'
          owner_name='^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_][A-Za-z0-9_.-]*$'
          if [[ ! "$FORSGREN_SHA" =~ $full_commit ]]; then
            echo "::error title=forsgren commit::job.workflow_sha is not a full 40-digit commit; forsgren is installed only from the exact commit this workflow is called at"
            exit 1
          fi
          if [[ ! "$FORSGREN_REPOSITORY" =~ $owner_name ]]; then
            echo "::error title=forsgren repository::job.workflow_repository is not one owner/name; forsgren is installed only from the repository this workflow lives in"
            exit 1
          fi
          echo "forsgren ${FORSGREN_REPOSITORY}@${FORSGREN_SHA}"
          export GOBIN="${RUNNER_TEMP}/forsgren-bin"
          go install "github.com/${FORSGREN_REPOSITORY}/cmd/forsgren@${FORSGREN_SHA}"
          echo "${GOBIN}" >> "$GITHUB_PATH"

      # The CALLER's repository, to read its forsgren.config.yml: the commit
      # that triggered the run, at the workspace root. Pinned by full commit
      # like every action here (the very one Quality's checkout uses), and
      # persist-credentials: false so the token is not left in the checkout's
      # git config for the steps after it; the one step that pushes brings
      # its own header for that one command. The checkout itself needs only
      # the read half of the job's contents: write.
      - name: Check out the caller's repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A NEW install has no forsgren.config.yml yet: forsgren init-config
      # writes the starter (version: 1, projects: [], a commented example)
      # when the file is missing and keeps an existing one byte for byte
      # (forsgren#12). Only when it says "created" is the one file committed
      # to the branch the run is on (GITHUB_REF, from the runner's env: a
      # scheduled run is always on the default branch, and no event payload
      # is needed to know it), as github-actions[bot], so the next run finds
      # it; the check after this step then passes on the starter. A kept
      # file exits 0 before any branch logic, so a daily run never fails
      # here. A created one on a ref that is not a branch (a tag) fails by
      # name: there is no branch to commit to.
      #
      # The commit names its author and committer in git's own environment
      # variables and sets GIT_CONFIG_COUNT=0 for itself. git's environment
      # outranks `git -c`, so an identity or a signing configuration inherited
      # from the caller's job (GIT_AUTHOR_*, GIT_COMMITTER_*, GIT_CONFIG_COUNT
      # with commit.gpgsign) would otherwise change who the commit is by, or
      # make it fail; this way it cannot.
      #
      # The push carries the token without storing it. The checkout keeps no
      # credential (persist-credentials: false, zizmor's artipacked rule), so
      # this step hands git an Authorization header for this one command
      # through GIT_CONFIG_COUNT / GIT_CONFIG_KEY_0 / GIT_CONFIG_VALUE_0 in
      # the environment, which is how actions/checkout sends it too. Not
      # `git -c http.extraheader=...` and not a token in the push URL: both
      # put the token on the command line, where ps shows it and git's own
      # error messages quote the URL. Here it is in no argument, in no file
      # and in no message, and it is never echoed. The token is the caller's
      # GITHUB_TOKEN (github.token in a called workflow), through env: only.
      # Inline for the reason the install step is: forsgren's scripts are not
      # on the runner. Scripts/test_metrics_workflow.sh executes this block
      # with a real git against a local remote, and with the real forsgren.
      - name: Write the starter configuration on a new install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(forsgren init-config --config forsgren.config.yml)"
          echo "$result"
          if [[ "$result" != "created forsgren.config.yml" ]]; then
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error title=forsgren starter::forsgren.config.yml was missing and the starter can be committed only on a branch; run this workflow on one"
            exit 1
          fi
          git add -- forsgren.config.yml
          GIT_CONFIG_COUNT=0 \
          GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit --quiet -m 'forsgren: add a starter forsgren.config.yml' -- forsgren.config.yml
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git push --quiet origin "HEAD:${GITHUB_REF}"

      # forsgren check-config reads the caller's forsgren.config.yml and says
      # in one line whether it is valid. A missing or invalid file fails the
      # job here, before anything is rendered or published, with
      # check-config's message in the log and, after a cross mark, in the
      # run's step summary. The message can quote the file, so it reaches
      # the log with workflow commands stopped (forsgren#9): between
      # ::stop-commands::<token> and ::<token>::, under a token drawn fresh
      # from /dev/urandom on every run, a line of it that starts with :: is
      # shown and never run, and the file cannot know the token to turn
      # commands back on. Inline: forsgren's scripts are not on the runner,
      # and Scripts/test_metrics_workflow.sh executes this block, with a stub
      # forsgren and with the real one.
      - name: Check the caller's forsgren configuration
        shell: bash
        run: |
          set -euo pipefail
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          status=0
          message="$(forsgren check-config --config forsgren.config.yml 2>&1)" || status=$?
          echo "::stop-commands::${token}"
          printf '%s\n' "$message"
          echo "::${token}::"
          if [[ "$status" -ne 0 ]]; then
            printf '%s\n' "❌ ${message}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Render the page
        shell: bash
        run: |
          set -euo pipefail
          forsgren render --out "${RUNNER_TEMP}/site" --config forsgren.config.yml

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
