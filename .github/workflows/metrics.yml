# .github/workflows/metrics.yml
#
# The REUSABLE workflow an installation's data repository calls once a day
# (forsgren#4, walking skeleton step 2 of #3). It installs the forsgren
# release the caller names, renders the page and publishes it to the
# caller's GitHub Pages. Today the page is the skeleton's placeholder,
# "Forsgren <version>"; collect and the history file come later.
#
# It runs only when called (workflow_call): never in forsgren's own
# repository, never on a pull request. Its job runs in the CALLER's
# repository, with the caller's token, on a GitHub-hosted runner, and checks
# nothing out: forsgren arrives as a Go module through go install, verified
# against the Go checksum database, never as this repository's working tree.
#
# THE CALLER (see README, Running forsgren) pins this file and the forsgren
# it installs to the same release:
#   uses: yveshanoulle/forsgren/.github/workflows/metrics.yml@v0.0.1
#   with:
#     forsgren-version: v0.0.1
# and grants the job's permissions below (a called workflow can only keep or
# narrow the permissions its caller's job grants, never widen them), and has
# GitHub Pages set to build from GitHub Actions.
#
# Scripts/test_metrics_workflow.sh pins this file's shape in sfl and Quality:
# workflow_call only, forsgren-version required, the version check run before
# go install and executed there against release tags and non-tags, the input
# through env: only, setup-go on go.mod's toolchain.
name: Metrics

on:
  workflow_call:
    inputs:
      forsgren-version:
        description: "The forsgren release to install and run, a tag such as v0.0.1 (never latest or a branch)"
        type: string
        required: true

# Nothing at the workflow level; the one job asks for what it uses.
permissions: {}

jobs:
  publish:
    name: Render and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read    # read-only, as GitHub's Pages starter workflow declares it; nothing is checked out or written
      pages: write      # deploy-pages publishes the site to the caller's GitHub Pages
      id-token: write   # deploy-pages proves to Pages, with an OIDC token, which run deploys
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One Pages deployment at a time per repository; a second run waits
    # rather than cancelling one in flight, as GitHub's Pages starter does.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # The release tag, and nothing else, reaches go install: latest, a
      # branch or a commit would install whatever that names on the day of
      # the run, and the page would show a version nobody pinned. Inline, not
      # a Scripts/ file: the job checks nothing out, so forsgren's scripts
      # are not on the runner, and the only forsgren ref it could check one
      # out at is the version still unchecked. The input arrives through
      # env:, never as ${{ }} in the script.
      - name: Check the forsgren version is a release tag
        shell: bash
        env:
          FORSGREN_VERSION: ${{ inputs.forsgren-version }}
        run: |
          set -euo pipefail
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$FORSGREN_VERSION" =~ $release_tag ]]; then
            echo "::error title=forsgren-version::forsgren-version must be a release tag vMAJOR.MINOR.PATCH, such as v0.0.1; latest, a branch, a commit or a pre-release is refused"
            exit 1
          fi
          echo "forsgren ${FORSGREN_VERSION}"

      # Exactly the Go of go.mod's toolchain line, the Go sfl, FBP.sh and
      # Quality build with (Scripts/test_metrics_workflow.sh keeps the two
      # equal). setup-go exports GOTOOLCHAIN=local, so go install builds with
      # this Go and never switches to another: a forsgren release whose go
      # line needs a newer Go fails here by name rather than building with
      # one nobody chose. No cache: the caller's repository has no go.sum to
      # key it on, and a restored cache is one more input to the published
      # page.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install forsgren
        shell: bash
        env:
          FORSGREN_VERSION: ${{ inputs.forsgren-version }}
        run: |
          set -euo pipefail
          export GOBIN="${RUNNER_TEMP}/forsgren-bin"
          go install "github.com/yveshanoulle/forsgren/cmd/forsgren@${FORSGREN_VERSION}"
          echo "${GOBIN}" >> "$GITHUB_PATH"

      - name: Render the page
        shell: bash
        run: |
          set -euo pipefail
          forsgren render --out "${RUNNER_TEMP}/site"

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
