# .github/workflows/dco.yml
#
# The DCO sign-off check (road to public, step 4; the ruling on forsgren#1:
# EUPL-1.2 plus a Developer Certificate of Origin sign-off on every commit,
# see CONTRIBUTING.md). On every pull request, and on every push to main
# (forsgren#81: we never use pull requests, so main's commits were never
# checked), every commit in it must carry
# a Signed-off-by trailer from its author, except the commits of the Bot
# account that opened it (Dependabot's, ruled by Yves 2026-10-02: GitHub's
# account type and the pull request's opener, never a commit's author
# email); Scripts/check_dco.sh decides, and
# Scripts/test_check_dco.sh proves it in sfl and Quality on every run.
#
# On a push the commits are those of before..after, listed from git by
# Scripts/dco_push_commits.sh (a new branch: its head commit; an empty range
# is red), with no account and so no bot exemption. Commits of an earlier
# push are not judged again. Merging a pull request on GitHub puts its
# commits and a merge commit on main (forsgren#267, decision #268):
# Scripts/dco_push_check.sh asks the API which pull requests each pushed
# commit belongs to; a commit of a merged pull request of this repository
# whose own DCO run succeeded is not judged again, the merge commit GitHub
# made for it is exempt, every other commit gets the strict rule, and a
# failed API call is red. The second job, private-names (forsgren#213),
# judges the messages of the same commits with the private-names matcher.
#
# It triggers on pull_request, as quality.yml does, and safely:
#   - pull_request, NEVER pull_request_target: a fork's pull request gets a
#     read-only token and no secrets;
#   - a GitHub-hosted runner, never a self-hosted one:
#     Scripts/check_workflow_triggers.sh is red on a pull-request trigger
#     with any job it cannot prove GitHub-hosted;
#   - the pull request's code is never checked out. The commits are read
#     through the API, and the one file checked out is Scripts/check_dco.sh
#     at the BASE commit, so a pull request cannot change the check that
#     judges it. (It can change this workflow file, which GitHub reads from
#     the pull request: the review of a change to it is the guard there.)
#   - the pull request's number and the repository reach the shell through
#     env:, never as ${{ }} inside run: (template injection; zizmor gates it).
name: DCO

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read        # the checkout of Scripts/check_dco.sh at the base commit
  pull-requests: read   # the pull request's commit list; the pull requests of a pushed commit
  checks: read          # a merged pull request's DCO check run (Scripts/dco_push_check.sh)

# One run per pull request, a new push to it cancels the run in flight. Never
# on main: every push there is checked, so its group is the commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0: a push's range before..after needs the history. The
      # pull request path reads its commits through the API and only the
      # sparse files from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            Scripts/check_dco.sh
            Scripts/dco_push_check.sh
            Scripts/dco_push_commits.sh
            Scripts/dco_pr_commits.sh
            Scripts/lib_dco_api.sh
          sparse-checkout-cone-mode: false

      # One line per commit, <sha> <author account> <base64 author email>
      # <base64 message>, the shape Scripts/check_dco.sh reads (see its
      # header), listed by Scripts/dco_pr_commits.sh (forsgren#213: the second
      # job lists them the same way). The account is <type>:<login> of the
      # GitHub account the commit is linked to (.author, null: -); the opener
      # is the account that opened the pull request. The list API returns at
      # most 250 commits; a pull request longer than that is checked on its
      # first 250.
      - name: Check every commit is signed off by its author
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_OPENER: ${{ github.event.pull_request.user.type }}:${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/dco_commits.txt"
          ./Scripts/dco_pr_commits.sh "$REPO" "$PR_NUMBER" > "$commits"
          ./Scripts/check_dco.sh "$commits" "$PR_OPENER"

      # A push to main: the commits of before..after, from git (fetch-depth
      # 0 above), with the same check, except that a commit of a merged pull
      # request whose own DCO run succeeded is not judged again and GitHub's
      # merge commit for it is exempt (Scripts/dco_push_check.sh, which reads
      # the API with the job token). The token, the repository and the two
      # shas reach the shell through env:, never as ${{ }} inside run:.
      - name: Check every pushed commit is signed off by its author
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/dco_push_commits.txt"
          ./Scripts/dco_push_commits.sh "$BEFORE" "$AFTER" > "$commits"
          ./Scripts/dco_push_check.sh "$REPO" "$commits"

  # The private names in commit messages (forsgren#213). This repository is
  # public and a commit message is published with the commit; FBP.sh refuses a
  # message that names a private name, but a pull request's commits and a hand
  # made push never pass through it. Why in this workflow and not in
  # quality.yml: this is the one workflow that already triggers on every pull
  # request and every push to main without checking out the pull request's
  # code, with the full history a push's range needs and the two commit
  # listings (Scripts/dco_pr_commits.sh, Scripts/dco_push_commits.sh); Quality
  # checks the tree, and a pull request's own checkout would let it change the
  # check that judges it. A job of its own, so a DCO finding and a
  # private-name finding are two red checks, and one never hides the other.
  #
  # The commits are those the DCO job lists, except where a push cannot say
  # which are new: a new branch (all-zero before) or a before this checkout
  # does not have (a force-push) checks every commit of the pushed head that is
  # on no other branch or tag (dco_push_commits.sh --fresh), never only the
  # head commit and never nothing. The list reaches the check through env: from
  # the Actions secrets Quality uses; a pull request from a fork gets none, and
  # the check is then exit 2, never a pass (Scripts/check_commit_messages.sh).
  # The output never prints a name, a message or a subject.
  private-names:
    name: Private names in commit messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            Scripts/check_commit_messages.sh
            Scripts/check_private_names.sh
            Scripts/lib_private_names.sh
            Scripts/dco_push_commits.sh
            Scripts/dco_pr_commits.sh
            Scripts/lib_dco_api.sh
          sparse-checkout-cone-mode: false

      - name: Check no commit message of the pull request names a private name
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORSGREN_PRIVATE_NAMES: ${{ secrets.FORSGREN_PRIVATE_NAMES }}
          FORSGREN_PRIVATE_NAMES_EXTRA: ${{ secrets.FORSGREN_PRIVATE_NAMES_EXTRA }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/message_commits.txt"
          ./Scripts/dco_pr_commits.sh "$REPO" "$PR_NUMBER" > "$commits"
          ./Scripts/check_commit_messages.sh "$commits"

      - name: Check no pushed commit message names a private name
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORSGREN_PRIVATE_NAMES: ${{ secrets.FORSGREN_PRIVATE_NAMES }}
          FORSGREN_PRIVATE_NAMES_EXTRA: ${{ secrets.FORSGREN_PRIVATE_NAMES_EXTRA }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/message_commits.txt"
          ./Scripts/dco_push_commits.sh --fresh "$BEFORE" "$AFTER" > "$commits"
          ./Scripts/check_commit_messages.sh "$commits"
