# .github/workflows/dco.yml
#
# The DCO sign-off check (road to public, step 4; the ruling on forsgren#1:
# EUPL-1.2 plus a Developer Certificate of Origin sign-off on every commit,
# see CONTRIBUTING.md). On every pull request, and on every push to main
# (forsgren#81: we never use pull requests, so main's commits were never
# checked), every commit in it must carry
# a Signed-off-by trailer from its author, except the commits of the Bot
# account that opened it (Dependabot's, ruled by Yves 2026-10-02: GitHub's
# account type and the pull request's opener, never a commit's author
# email); Scripts/check_dco.sh decides, and
# Scripts/test_check_dco.sh proves it in sfl and Quality on every run.
#
# On a push the commits are those of before..after, listed from git by
# Scripts/dco_push_commits.sh (a new branch: its head commit; an empty range
# is red), with no account and so no bot exemption. Commits of an earlier
# push are not judged again.
#
# It triggers on pull_request, as quality.yml does, and safely:
#   - pull_request, NEVER pull_request_target: a fork's pull request gets a
#     read-only token and no secrets;
#   - a GitHub-hosted runner, never a self-hosted one:
#     Scripts/check_workflow_triggers.sh is red on a pull-request trigger
#     with any job it cannot prove GitHub-hosted;
#   - the pull request's code is never checked out. The commits are read
#     through the API, and the one file checked out is Scripts/check_dco.sh
#     at the BASE commit, so a pull request cannot change the check that
#     judges it. (It can change this workflow file, which GitHub reads from
#     the pull request: the review of a change to it is the guard there.)
#   - the pull request's number and the repository reach the shell through
#     env:, never as ${{ }} inside run: (template injection; zizmor gates it).
name: DCO

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read        # the checkout of Scripts/check_dco.sh at the base commit
  pull-requests: read   # the pull request's commit list

# One run per pull request, a new push to it cancels the run in flight. Never
# on main: every push there is checked, so its group is the commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0: a push's range before..after needs the history. The
      # pull request path reads its commits through the API and only the
      # sparse files from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            Scripts/check_dco.sh
            Scripts/dco_push_commits.sh
          sparse-checkout-cone-mode: false

      # One line per commit, <sha> <author account> <base64 author email>
      # <base64 message>, the shape Scripts/check_dco.sh reads (see its
      # header). The account is <type>:<login> of the GitHub account the
      # commit is linked to (.author, null: -); the opener is the account
      # that opened the pull request. gh is on every
      # GitHub-hosted runner, and its --jq is gh's own, so the runner needs
      # no jq. The list API returns at most 250 commits; a pull request
      # longer than that is checked on its first 250.
      - name: Check every commit is signed off by its author
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_OPENER: ${{ github.event.pull_request.user.type }}:${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/dco_commits.txt"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | "\(.sha) \(if .author == null then "-" else "\(.author.type):\(.author.login)" end) \(.commit.author.email // "" | @base64) \(.commit.message | @base64)"' \
            > "$commits"
          ./Scripts/check_dco.sh "$commits" "$PR_OPENER"

      # A push to main: the commits of before..after, from git (fetch-depth
      # 0 above), with the same check. The two shas reach the shell through
      # env:, never as ${{ }} inside run:.
      - name: Check every pushed commit is signed off by its author
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          commits="${RUNNER_TEMP}/dco_push_commits.txt"
          ./Scripts/dco_push_commits.sh "$BEFORE" "$AFTER" > "$commits"
          ./Scripts/check_dco.sh "$commits"
