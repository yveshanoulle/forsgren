# .github/workflows/release.yml
#
# The Release workflow (forsgren#221): one run releases patch, minor or major
# and does what the manual release did, step by step. All logic lives in tested
# scripts (Scripts/release_*.sh, each with a self-test that runs in sfl and
# Quality); this file only calls them, in this order, and
# Scripts/test_release_workflow.sh pins it.
#
# A release makes no commit (forsgren#237): it tags main's Quality-green head
# as it is. The version an installation reports comes from the go tool's build
# information for the tagged commit, not from a file a bump rewrites.
#
#   a. Quality is green on main's head (the sha of this run).
#   b. Scripts/release_plan.sh: the bump the labels of the issues closed since
#      the last release require, checked against the requested one; stops when
#      nothing was closed, an issue has no label, the bump is too low, or a
#      major is asked while an agent file lacks its proof run on the new major.
#      When only tools issues were closed (forsgren#289: a tooling update
#      needs no release) the plan says `release=none`: every step below is
#      skipped (`steps.plan.outputs.release != 'none'`), nothing is tagged and
#      the run ends green, the last step saying there was nothing to release.
#   c. The version is new (no tag, no release).
#   d. Main's head has not moved since Quality was proved green on it
#      (Scripts/release_quality.sh head), the step right before the publish.
#   e. `gh release create` makes the tag and the release together, Latest,
#      with the notes of step b, at that sha (RELEASE_SHA): a tag never exists
#      without its release.
#   f. Scripts/release_verify_install.sh: `go install` of the module at the
#      released sha must report the release (vX.Y.Z), not a pseudo-version; no
#      pin moves before it does.
#   g. forsgren-template: pins and README in one commit.
#   h. forsgren-metrics: a pin pull request, then (Scripts/release_metrics.sh) its
#      files are read (only the forsgren pins of this release), it is merged and
#      forsgren.yml is run there until it is green: the release is done only
#      when the metrics site runs the new version.
#   i. Scripts/dispatch_preview.sh starts the preview deploy at the released sha
#      so the preview never names an older version than the metrics site
#      (forsgren issue 236). A failed start fails this step; the release stays
#      published.
# The first step that writes the job summary is the token check, which puts the
# token's expiry on its first line (Scripts/release_token_expiry.sh: green over
# 30 days, yellow 30 to 8, red 7 or fewer and the run goes on, an expired token
# or one without an expiry fails the run before anything is pushed).
# Steps g and h use the secret FORSGREN_RELEASE_TOKEN, a fine-grained token
# (docs/updating-and-releases.md says which). It is checked first thing, so
# a missing secret stops the run before anything is pushed, and again in g and
# h, which fail with an ::error:: naming it and never skip. The token needs
# Workflows: Read and write as well (the pins are in .github/workflows).
# The last step runs whatever happened and says what was done and what was not
# (Scripts/release_report.sh); the step that failed it reads from the outcomes
# of the steps (steps.<id>.outcome, passed in RELEASE_STEP_OUTCOMES), never from
# the log, so a step that records nothing is still the one named.
#
# Resume: a run that failed after the release was published cannot simply be
# started again (the version is no longer free), and the last step says which
# input to use (Scripts/release_report.sh). A run that failed before the
# publish made nothing and is started again.
#   resume: pins     the release was published, the install check, the template
#                    or the metrics step failed: finds the latest release
#                    (Scripts/release_resume.sh), skips Quality, the plan, the
#                    head check and the publish, and does the install check and
#                    the template and metrics steps for that release. All are
#                    idempotent: a repository already on the pin, or a pull
#                    request already open or merged, is "already done". The
#                    install check is the one that keeps a pin from moving onto
#                    a sha that reports a pseudo-version.
#
# Triggers: workflow_dispatch only: from the Actions page, or through the API
# (`gh workflow run release.yml -f bump=patch`; patch is the default). Run it
# on main. Permissions: contents write (the tag and release), actions read (the
# Quality run of the head), issues read (the closed issues).
# Everything user-controlled reaches the shell through env:, never ${{ }}
# inside run:.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The kind of release: checked against the labels of the issues closed since the last one"
        type: choice
        options: [patch, minor, major]
        default: patch
      resume:
        description: "none: a new release. pins: published, but the install check, the template or the metrics step failed"
        type: choice
        options: [none, pins]
        default: none

permissions:
  contents: read

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # the tag and the release
      actions: read     # the Quality run of main's head
      issues: read      # the issues closed since the last release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Require a run on main
        id: main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The Release workflow runs on main, this run is on ${REF}."
            exit 1
          fi

      - name: Check out main
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 200  # plan: the commits since the latest tag name the open issues that landed
          fetch-tags: true  # plan: the commits since the latest tag name the open issues that landed
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Start the log of what is done
        id: log
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_LOG=${RUNNER_TEMP}/release.log" >> "$GITHUB_ENV"
          toolchain="$(./Scripts/go_toolchain.sh)"
          echo "GOTOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

      - name: Check the release token is set
        id: token
        shell: bash
        env:
          FORSGREN_RELEASE_TOKEN: ${{ secrets.FORSGREN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          ./Scripts/release_token_expiry.sh
          ./Scripts/release_pins.sh token
          echo "token: FORSGREN_RELEASE_TOKEN is set" >> "$RELEASE_LOG"

      - name: Find the release to resume
        id: resume
        if: ${{ inputs.resume != 'none' }}
        shell: bash
        env:
          RESUME_MODE: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          ./Scripts/release_resume.sh "$RESUME_MODE" | tee "${RUNNER_TEMP}/resume.txt"
          grep -E '^(version|tag|sha)=' "${RUNNER_TEMP}/resume.txt" >> "$GITHUB_OUTPUT"
          echo "resume: $(grep '^tag=' "${RUNNER_TEMP}/resume.txt") at $(grep '^sha=' "${RUNNER_TEMP}/resume.txt" | cut -d= -f2)" >> "$RELEASE_LOG"

      - name: Quality is green on main
        id: quality
        if: ${{ inputs.resume == 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/release_quality.sh check "$GITHUB_SHA"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "quality: green on ${GITHUB_SHA}" >> "$RELEASE_LOG"

      - name: Plan the release
        id: plan
        if: ${{ inputs.resume == 'none' }}
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          ./Scripts/release_plan.sh "$BUMP" --notes "${RUNNER_TEMP}/notes.md" | tee "${RUNNER_TEMP}/plan.txt"
          grep -E '^(version|tag|issues|tools|release)=' "${RUNNER_TEMP}/plan.txt" >> "$GITHUB_OUTPUT"
          if grep -qxF 'release=none' "${RUNNER_TEMP}/plan.txt"; then
            echo "plan: nothing to release, only tools issues since the latest release: $(grep '^tools=' "${RUNNER_TEMP}/plan.txt" | cut -d= -f2)" >> "$RELEASE_LOG"
          else
            echo "plan: $(grep '^version=' "${RUNNER_TEMP}/plan.txt") for $(grep '^issues=' "${RUNNER_TEMP}/plan.txt")" >> "$RELEASE_LOG"
          fi

      - name: Check the version is new
        id: free
        if: ${{ inputs.resume == 'none' && steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          ./Scripts/release_publish.sh free "$VERSION"
          echo "free: no tag and no release v${VERSION}" >> "$RELEASE_LOG"

      - name: Check main has not moved
        id: head
        if: ${{ inputs.resume == 'none' && steps.plan.outputs.release != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          ./Scripts/release_quality.sh head "$GITHUB_SHA"
          echo "head: main's head is still ${GITHUB_SHA}" >> "$RELEASE_LOG"

      - name: Create the tag and the release
        id: publish
        if: ${{ inputs.resume == 'none' && steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
        run: |
          set -euo pipefail
          ./Scripts/release_publish.sh create "$VERSION" "$RELEASE_SHA" "${RUNNER_TEMP}/notes.md"
          echo "publish: tag and release v${VERSION} at ${RELEASE_SHA}, Latest" >> "$RELEASE_LOG"

      # The version an installation shows comes from the go tool's build
      # information for the pinned commit, so the tagged sha must report the
      # release before any pin moves onto it. Also run by resume: pins.
      - name: Check an install of the release reports its version
        id: verify-install
        if: ${{ steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
        run: |
          set -euo pipefail
          ./Scripts/release_verify_install.sh "$VERSION" "$RELEASE_SHA" | tee "${RUNNER_TEMP}/verify-install.txt"
          echo "verify-install: go install at ${RELEASE_SHA} reports v${VERSION}" >> "$RELEASE_LOG"

      - name: Move the pins and README of forsgren-template
        id: template
        if: ${{ steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
          FORSGREN_RELEASE_TOKEN: ${{ secrets.FORSGREN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          ./Scripts/release_pins.sh template "$VERSION" "$RELEASE_SHA"
          echo "template: pins and README at ${VERSION}" >> "$RELEASE_LOG"

      - name: Open the pin pull request in forsgren-metrics
        id: metrics-pr
        if: ${{ steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
          FORSGREN_RELEASE_TOKEN: ${{ secrets.FORSGREN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          ./Scripts/release_pins.sh metrics "$VERSION" "$RELEASE_SHA"
          echo "metrics-pr: pin pull request for ${VERSION} opened or found" >> "$RELEASE_LOG"

      - name: Merge the pin pull request and run forsgren in forsgren-metrics
        id: metrics
        if: ${{ steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
          FORSGREN_RELEASE_TOKEN: ${{ secrets.FORSGREN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          ./Scripts/release_metrics.sh "$VERSION" "$RELEASE_SHA" | tee "${RUNNER_TEMP}/metrics.txt"
          echo "metrics: $(grep '^OK: metrics: ' "${RUNNER_TEMP}/metrics.txt" | sed 's/^OK: metrics: //')" >> "$RELEASE_LOG"

      - name: Start the preview deploy of the release
        id: preview
        if: ${{ steps.plan.outputs.release != 'none' }}
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version || steps.resume.outputs.version }}
          RELEASE_SHA: ${{ steps.quality.outputs.sha || steps.resume.outputs.sha }}
          PREVIEW_DISPATCH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if ! ./Scripts/dispatch_preview.sh "$RELEASE_SHA"; then
            echo "::error::❌ the preview deploy of v${VERSION} at ${RELEASE_SHA} was not started; the release is published, start the preview by hand with Scripts/dispatch_preview.sh"
            exit 1
          fi
          echo "preview: deploy started at ${RELEASE_SHA}" >> "$RELEASE_LOG"

      - name: Say what was done
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_RESUME: ${{ inputs.resume }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_PLAN_OUTPUT: ${{ runner.temp }}/plan.txt
          RELEASE_STEP_OUTCOMES: |
            main=${{ steps.main.outcome }}
            checkout=${{ steps.checkout.outcome }}
            setup-go=${{ steps.setup-go.outcome }}
            log=${{ steps.log.outcome }}
            token=${{ steps.token.outcome }}
            resume=${{ steps.resume.outcome }}
            quality=${{ steps.quality.outcome }}
            plan=${{ steps.plan.outcome }}
            free=${{ steps.free.outcome }}
            head=${{ steps.head.outcome }}
            publish=${{ steps.publish.outcome }}
            verify-install=${{ steps.verify-install.outcome }}
            template=${{ steps.template.outcome }}
            metrics-pr=${{ steps.metrics-pr.outcome }}
            metrics=${{ steps.metrics.outcome }}
            preview=${{ steps.preview.outcome }}
        run: ./Scripts/release_report.sh "${RELEASE_LOG:-${RUNNER_TEMP}/release.log}" "$JOB_STATUS"
