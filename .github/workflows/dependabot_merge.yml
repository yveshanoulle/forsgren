# .github/workflows/dependabot_merge.yml
#
# The Dependabot merge policy for this repository's own Dependabot pull
# requests (forsgren#664), since forsgren#666 a CALLER of the reusable
# .github/workflows/dependabot_merge_policy.yml, the very workflow
# installations call: forsgren runs its own merge policy the way every
# installation does. When Quality or DCO completes for a Dependabot pull
# request, the called workflow judges that pull request with
# Scripts/dependabot_merge_policy.sh against .github/dependabot-merge.conf
# (read from the default branch), keeps one comment on it and, with the
# switch on, squash-merges an ELIGIBLE one at the head commit the policy
# checked. Every step, and every safeguard, is in the called file.
#
# Not to be confused with auto_update.yml, the reusable workflow an
# installation calls to bump its own forsgren pin.
#
# The call is local (./.github/workflows/...): a workflow_run workflow runs
# from the default branch, so the called file and the scripts it fetches at
# its own commit (job.workflow_sha) are the default branch's, never a pull
# request's. An installation pins the file by commit instead
# (docs/dependabot-merge.md).
#
# zizmor's dangerous-triggers audit flags every workflow_run trigger, so the
# workflow_run line carries the one inline ignore of that rule (on that line,
# not above it: a later risky trigger is still reported). The exception holds
# only while the called workflow keeps its safeguards (no checkout of this
# repository, only forsgren's three scripts at the called file's own commit
# without credentials, no artifact, no cache, the settings from the default
# branch, the one secret read in the merge step alone, gated by the policy's
# ELIGIBLE and the switch on, merging only the head commit the policy
# checked, and the policy's own checks of the author, the head repository,
# the dependabot/ branch and the head the run was for), which
# Scripts/test_dependabot_merge_policy_workflow.sh pins, and while this
# caller passes the one secret by name and nothing else, which
# Scripts/test_dependabot_merge_policy.sh pins.
#
# Kill switch, the repository variable DEPENDABOT_AUTOMERGE, passed as the
# input mode: off = log only, no comment; on = comment "eligible: merging" or
# "not eligible: no merge" and merge when ELIGIBLE; unset, dry-run or any
# other value = comment "would merge" or "would not merge", merge nothing.
# The expected workflows are listed in .github/dependabot-merge.conf, and
# Scripts/test_dependabot_merge_policy.sh holds the list below to it.
name: Dependabot merge

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [Quality, DCO]
    types: [completed]

# Exactly what the called workflow declares: a called workflow can only keep
# or narrow what its caller grants.
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  policy:
    name: Dependabot merge policy
    uses: ./.github/workflows/dependabot_merge_policy.yml
    with:
      settings-file: .github/dependabot-merge.conf
      mode: ${{ vars.DEPENDABOT_AUTOMERGE }}
    secrets:
      DEPENDABOT_MERGE_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
