# forsgren.config.yml: which repositories this installation measures.
#
# forsgren wrote this file because it was missing, and never rewrites a file
# that exists: from here on it is yours. Edit it and commit it.
#
# The file lists projects. A project is a name and the GitHub repositories
# that ship it (a product can be several repositories); the page shows each
# project in its own section. Check your edits before a run depends on them:
#
#   forsgren check-config --config forsgren.config.yml
#
# Each repository says what counts as a deployment of it, with one of three
# forms:
#
#   (left out)            a GitHub Deployment to the environment production
#                         whose status is success: the default
#   deployment: environment=<name>
#                         the same, to another environment
#   deployment: workflow=<file>.yml
#                         a successful run on main of that workflow file in
#                         .github/workflows/ (.yaml works too)
#   deployment: release   a published GitHub Release
#
# The page shows a row per project, its total. A repository can add rows
# under it, named as you write them here; the page never shows a repository's
# own name. Either one row for all its deployments:
#
#   label: Website
#
# or, for a repository that deploys several services, a row per deployment
# task (a task left out counts in the total only; not for release):
#
#   services:
#     deploy-api: API
#
# The view: line below chooses what the site's root page shows, marked in the
# menu at the top of every page: standard is the band, the number and the
# count, and numbers the numbers only, and scoring each metric's DORA Quick
# Check score. Change it to view: numbers or view: scoring for that view.
# Without a view: line, the root page is the table with the band, the number
# and the count, and the menu marks no view. Each view is also its own page,
# at /standard/, /numbers/ and /scoring/, and the menu links them all.
#
# The auto_update: lines below switch on the merging of forsgren's own
# updates. They are on at major level: once the caller workflow of
# forsgren-template is in this repository, Dependabot's pull request for a new
# release of forsgren merges itself, unless the update fails or is blocked.
# major permits major, minor and patch updates; it does not mean a major
# release is safe. Patch updates are intended for fixes, and minor updates can
# bring new behaviour. A release is only cut when forsgren's Quality checks
# are green, Dependabot proposes it only after the update wait, and the merge
# goes through only when the pull request changes nothing but the forsgren pin
# to a published release. Nothing checks a release against this installation's
# own data. To take fewer updates, set auto_update_level: to minor or to patch.
# auto_update: false switches it off, and you merge each update by hand.
# auto_update_level: is optional and is major when left out.
#
# tbd_figures: is optional. The TBD page shows the median of each measure, one
# column per measure; that is the default. To write the key, remove the "# " in
# front of the next line, and change median to all to show the mean, the median
# and the 90th percentile of each measure instead. A value that is neither is
# not used, and the settings page says why.
#
# tbd_figures: median  # the TBD table's figures: median (default) or all
#
# thousands_separator: is optional and narrow_space when left out. It sets how
# the pages write a count of 1000 or more: narrow_space (1 282, a narrow
# no-break space), comma (1,282), period (1.282) or none (1282).
# decimal_separator: is optional and point when left out. It sets the mark of
# every decimal: point (6.0) or comma (6,0). The two may not be the same mark:
# comma with comma, or period with point, is not accepted and both keys keep
# their defaults, so a period for the thousands needs decimal_separator: comma.
# To write a key, remove the "# " in front of its line.
#
# thousands_separator: narrow_space  # narrow_space (default), comma, period or none
# decimal_separator: point  # point (default) or comma
#
# tbd_time_to_main:, tbd_pr_lead_time:, tbd_bot_pr_lead_time: and sub_rows: are
# optional and all true when left out. Each hides one thing when set to false:
# the Time to main column, the PR Lead Time column, the Bot PR Lead Time column
# of the TBD table, and the label and service rows under each project in every
# table. Measuring goes on either way. To write a key, remove the "# " in front
# of its line and change true to false. A value that is neither true nor false
# is not used, and the settings page says why.
#
# tbd_time_to_main: true  # the TBD table's Time to main column: true (default) or false
# tbd_pr_lead_time: true  # the TBD table's PR Lead Time column: true (default) or false
# tbd_bot_pr_lead_time: true  # the TBD table's Bot PR Lead Time column: true (default) or false
# sub_rows: true  # the label and service rows of every table: true (default) or false
#
# The key week_page is optional and true when left out. The Week page (week.html)
# shows the deployments, failed deployments and fail rate of each weekday. Set it
# to false to take the page out of the menu; the page is still written and
# reachable by its address, and asks search engines to skip it. To write the key,
# remove the "# " in front of the next line. A value that is neither true nor
# false is not used, and the settings page says why.
#
# week_page: true  # the Week page in the menu: true (default) or false
#
# The key week_commits is optional and false when left out. The Week page then
# shows Deployments, Failed and Fail rate; set it to true to add the Commits
# columns under Total and under each weekday. To write the key, remove the "# "
# in front of the next line. A value that is neither true nor false is not used,
# and the settings page says why.
#
# week_commits: false  # the Week page's Commits columns: false (default) or true
#
# same_developer: is optional. It lists groups of GitHub logins that count as
# one developer, for an assistant account that works on someone's behalf or a
# person with two accounts. The first login of a group names the developer,
# logins are compared without case, and a login can be in one group only. Each
# group needs two or more logins; a group that breaks a rule is not used, and
# the settings page says why. Remove the "# " in front of the two lines to use
# it, with your own logins:
#
# same_developer:
#   - [maintainer, assistant-account]
#
# Example, with made-up names. To use it, remove the five lines version: 1,
# view: standard, auto_update: true, auto_update_level: major and projects: []
# below, then remove the "# " in front of the example:
#
# version: 1
# view: standard
# auto_update: true
# auto_update_level: major
# projects:
#   - name: Acme Shop
#     repositories:
#       - name: acme/api
#         services:
#           deploy-api: API
#           deploy-admin: Admin
#       - name: acme/ios-app
#         deployment: workflow=testflight.yml
#         label: iOS
#   - name: Acme Tools
#     repositories:
#       - name: acme/cli
#         deployment: release
#
version: 1
view: standard
auto_update: true
auto_update_level: major  # possible options: major, minor, patch
history_days: 365  # how far back history goes, 30 to 1825 days (5 years)
history_chunk_days: 100  # how many days back each run adds until history_days is reached, 1 to 365
working_hours: 8  # a working day is configured as this many hours, 1 to 24
dora_days: 30  # the window of the DORA numbers in days: 30, 90 or 180
issues_page: false  # the Issues page. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
days_page: false  # the Daily page. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
numbers_scoring_page: unlisted  # the Numbers and scoring page. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
history_page: unlisted  # the History page. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
tbd_page: true  # the Trunk-based development (TBD) page. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
data_page: true  # the Data page: the first stored data per project. true: generated and in the menu; unlisted: generated, no menu entry; false: not generated
projects: []
