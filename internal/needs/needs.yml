- version: 0.4.0
  kind: permission
  workflow: .github/workflows/forsgren.yml
  permission: issues
  access: write
  steps: >-
    Add `issues: write` to the `permissions:` of the forsgren job in .github/workflows/forsgren.yml, so
    forsgren can open its setup issue. forsgren requires permissions to be declared explicitly on that
    job: `write-all` and `read-all` are intentionally unsupported, because forsgren follows
    least-privilege security practice.
- version: 1.16.0
  kind: permission
  workflow: .github/workflows/forsgren.yml
  permission: pull-requests
  access: read
  steps: >-
    Add `pull-requests: read` to the `permissions:` of the forsgren job in .github/workflows/forsgren.yml, so
    forsgren can read the merged pull requests of the measured repositories for the Mainline Lead Time. When
    FORSGREN_TOKEN is a fine-grained token, give it Pull requests (read) as well. Without it everything else is
    still collected: only the pull requests are not read.
