- version: 0.3.8
  kind: permission
  workflow: .github/workflows/forsgren.yml
  permission: issues
  access: write
  steps: "Add `issues: write` to the `permissions:` of the forsgren job in .github/workflows/forsgren.yml, so forsgren can open its setup issue. forsgren requires permissions to be declared explicitly on that job: `write-all` and `read-all` are intentionally unsupported, because forsgren follows least-privilege security practice."
