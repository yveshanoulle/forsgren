{{define "chart"}}<svg role="img" viewBox="0 0 {{.Width}} {{.Height}}" width="{{.Width}}" height="{{.Height}}"><title>{{.Title}}</title>{{range .Lines}}<g class="{{.Class}}" fill="none" stroke="currentcolor" stroke-dasharray="{{.Dash}}">{{range .Runs}}{{if .Dot}}<circle cx="{{.X}}" cy="{{.Y}}" r="{{$.DotRadius}}" fill="currentcolor" stroke="none"/>{{else}}<polyline points="{{.Points}}"/>{{end}}{{end}}</g>{{end}}</svg>
<ul class="legend">{{range .Lines}}<li><span class="{{.Class}}"><svg class="swatch" viewBox="0 0 32 8" aria-hidden="true"><line x1="0" y1="4" x2="32" y2="4" stroke="currentcolor" stroke-dasharray="{{.Dash}}"/></svg></span> <span class="visually-hidden">{{$.Project}}: </span>{{.Name}}</li>{{end}}</ul>{{end}}
