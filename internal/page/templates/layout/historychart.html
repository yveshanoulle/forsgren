{{define "chart"}}<svg role="img" viewBox="0 0 {{.Width}} {{.Height}}" width="{{.Width}}" height="{{.Height}}"><title>{{.Title}}</title>{{range .Runs}}{{if .Dot}}<circle cx="{{.X}}" cy="{{.Y}}" r="{{$.DotRadius}}" fill="currentcolor"/>{{else}}<polyline points="{{.Points}}" fill="none" stroke="currentcolor"/>{{end}}{{end}}</svg>{{end}}
