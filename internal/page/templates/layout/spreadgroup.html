{{define "spreadgroup"}}{{if .State}}            <td{{with .Colspan}} colspan="{{.}}"{{end}}>{{.State}}</td>
{{else}}{{range .Cells}}            {{template "notedcell" .}}
{{end}}{{end}}{{end}}
{{define "spreadheadtop"}}
            <th scope="colgroup" colspan="3">{{.Title}}</th>{{end}}
{{define "spreadheadall"}}
            <th scope="col"{{with .Subject}} aria-label="the mean of {{.}}"{{end}} class="num">mean</th>
            <th scope="col"{{with .Subject}} aria-label="the median of {{.}}"{{end}} class="num">median</th>
            <th scope="col"{{with .Subject}} aria-label="the p90 of {{.}}"{{end}} class="num">p90</th>{{end}}
{{define "spreadheadone"}}
            <th scope="col" aria-label="{{.MedianLabel}}" class="num">{{.Title}}</th>{{end}}
