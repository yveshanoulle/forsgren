{{define "title"}}{{.TbdTitle}} · {{.Title}}{{end -}}
{{template "header" .}}  <main>
    <h1 id="tbd-heading">{{.TbdTitle}}</h1>
{{if .Mainline}}    <div class="table-scroll" role="region" aria-labelledby="tbd-heading" tabindex="0">
      <table class="no-wrap">
        <thead>
          <tr>
            <th scope="col">Project</th>
            <th scope="col">Mainline Interval</th>
          </tr>
        </thead>
        <tbody>
{{range .Mainline}}          <tr>
            <th scope="row">{{.Project}}</th>
            <td>{{.Cell}}</td>
          </tr>
{{end}}        </tbody>
      </table>
    </div>
{{else}}    <p>{{.TbdMessage}}</p>
{{end}}  </main>
{{template "footer" .}}
